<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Family P&amp;L</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --border:#e3e6eb; --border-strong:#cfd4dc;
  --text:#14171c; --text-2:#4d535c; --muted:#767d88;
  --accent:#2a78d6; --accent-soft:#e3eefc;
  --gain:#0b7a3e; --loss:#c8352f;
  --gain-fill:#12a150; --loss-fill:#e34948; --zero-fill:#f0efec;
  --warn-bg:#fff5df; --warn-border:#f1c46b; --warn-text:#6b4b00;
  --err-bg:#fdecea; --err-border:#f0a29d; --err-text:#7d1f1a;
  --lt:#6250d6; --lt-soft:#ecebfb; --st:#2a78d6; --st-soft:#e3eefc; --in:#a05a00; --in-soft:#fbefdc;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --radius:14px; --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111317; --surface:#1a1d22; --surface-2:#22262c; --border:#2c3138; --border-strong:#3a4049;
    --text:#eef0f3; --text-2:#c0c5cc; --muted:#8f96a1;
    --accent:#5a9cf0; --accent-soft:#1d2d44;
    --gain:#4cc983; --loss:#ff7b73;
    --gain-fill:#1f9d58; --loss-fill:#e66767; --zero-fill:#383835;
    --warn-bg:#2e2410; --warn-border:#7a5a17; --warn-text:#f3d58c;
    --err-bg:#341a19; --err-border:#80322d; --err-text:#ffb4ad;
    --lt:#a99ff2; --lt-soft:#2a2650; --st:#79b1f3; --st-soft:#1d2d44; --in:#f0b35c; --in-soft:#3a2a12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111317; --surface:#1a1d22; --surface-2:#22262c; --border:#2c3138; --border-strong:#3a4049;
  --text:#eef0f3; --text-2:#c0c5cc; --muted:#8f96a1;
  --accent:#5a9cf0; --accent-soft:#1d2d44;
  --gain:#4cc983; --loss:#ff7b73;
  --gain-fill:#1f9d58; --loss-fill:#e66767; --zero-fill:#383835;
  --warn-bg:#2e2410; --warn-border:#7a5a17; --warn-text:#f3d58c;
  --err-bg:#341a19; --err-border:#80322d; --err-text:#ffb4ad;
  --lt:#a99ff2; --lt-soft:#2a2650; --st:#79b1f3; --st-soft:#1d2d44; --in:#f0b35c; --in-soft:#3a2a12;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)} .flat{color:var(--text-2)}
.muted{color:var(--muted)} .t2{color:var(--text-2)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.head-row{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:1180px;margin:0 auto}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.asof{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.25}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);vertical-align:2px;margin-left:6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 10px;max-width:1180px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.share-note{max-width:1180px;margin:0 auto;padding:0 16px 10px;font-size:12.5px;color:var(--text-2)}
.share-note b{color:var(--text);font-weight:600}
.share{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px;line-height:17px}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sub{min-height:32px;font-size:13px;padding:4px 12px}
.chip.sub[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
/* nested tabs: person (Anup | DD) → holder (All · PEW · JPW) → broker (All · Zerodha · Angel One) */
.ptabs{display:flex;gap:4px;max-width:1180px;margin:0 auto;padding:2px 16px 0;border-bottom:1px solid var(--border)}
.ptabs button{flex:none;border:0;background:none;padding:8px 18px 10px;font:inherit;font-size:16px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.ptabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
#holders{padding-top:10px}
#brokers .chip{min-height:30px;font-size:12.5px;padding:3px 12px}
.chips .lvl{flex:none;align-self:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;min-width:52px}
.mini-date{position:absolute;left:0;right:0;top:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 16px;background:var(--bg);border-bottom:1px solid var(--border);box-shadow:0 4px 10px -6px rgba(16,24,40,.18)}
.mini-date[hidden]{display:none}
.mini-date .md-btn{border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;width:30px;height:28px;display:grid;place-items:center;cursor:pointer;color:var(--text)}
.mini-date .md-btn:disabled{opacity:.35;cursor:default}
.mini-date .md-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mini-date .md-day{font-weight:650;font-size:14px;min-width:150px;text-align:center}
.mini-date .md-net{font-size:13px;font-weight:650}
/* ---------- data status ---------- */
.status-pill{margin-left:auto;display:inline-flex;align-items:center;gap:7px;border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:5px 11px;font:inherit;font-size:12px;color:var(--text-2);cursor:pointer;line-height:1.2;text-align:left}
.status-pill b{color:var(--text);font-weight:600}
.status-pill .dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--gain)}
.status-pill.warn .dot{background:#d99a00} .status-pill.error .dot{background:var(--loss)}
.status-pill.warn{border-color:var(--warn-border)} .status-pill.error{border-color:var(--err-border)}
#statusBar .alert{margin:0 0 12px;cursor:pointer}
#statusBar .alert ul{margin:4px 0 0;padding-left:18px}
.status-panel{margin:0 0 12px;padding:4px 0}
.status-panel h3{font-size:13px;margin:10px 16px 4px;color:var(--text-2);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.status-panel table{width:100%;border-collapse:collapse;font-size:13px}
.status-panel th,.status-panel td{text-align:left;padding:6px 16px;border-top:1px solid var(--border);white-space:nowrap}
.status-panel th{font-size:11px;color:var(--muted);font-weight:600}
.status-panel .tw{overflow-x:auto}
.status-panel .ok{color:var(--gain);font-weight:600} .status-panel .bad{color:var(--loss);font-weight:600} .status-panel .old{color:var(--warn-text);font-weight:600}
.status-panel ul{margin:4px 16px 10px;padding-left:18px;font-size:13px;color:var(--text-2)}
.status-panel li{margin:3px 0}
.chips .sep{flex:none;width:1px;background:var(--border-strong);margin:4px 2px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;padding:6px 0}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:14px 16px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 2px 10px}

/* ---------- date / month pager ---------- */
.pager{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pager .icon-btn{flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pager-label{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);position:relative;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;gap:8px}
.pager-label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:8px 4px}

/* ---------- hero ---------- */
.hero{padding:18px 18px 16px}
.hero .label{font-size:13px;color:var(--text-2);font-weight:500}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:11px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:600}

/* ---------- alerts ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin:12px 0 0;font-size:14px;border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
.alert.error{background:var(--err-bg);border-color:var(--err-border);color:var(--err-text)}
.alert b{font-weight:600}
.alert svg{flex:none;width:18px;height:18px;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- account cards ---------- */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.acct-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.acct-head .name{font-weight:650;font-size:16px}
.acct-head .broker{font-size:12px;color:var(--muted)}
.acct-head .net{margin-left:auto;font-weight:700;font-size:17px}
.sec-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 16px 4px;border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.row + .row{border-top:1px dashed var(--border)}
.row .l{min-width:0;flex:1}
.row .sym{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .meta{font-size:13px;color:var(--text-2)}
.row .r{text-align:right;flex:none}
.row .r .v{font-weight:650;font-size:15px}
.row .r .p{font-size:12px;color:var(--muted)}
details.sell{border-top:1px dashed var(--border)}
.sec-label + details.sell{border-top:0}
details.sell > summary{list-style:none;cursor:pointer}
details.sell > summary::-webkit-details-marker{display:none}
details.sell > summary .row{border:0}
.chev{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.lots{margin:0 16px 12px 16px;border-radius:10px;background:var(--surface-2);padding:4px 12px}
.lot{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.lot + .lot{border-top:1px solid var(--border)}
.lot .l{flex:1;min-width:0;color:var(--text-2)}
.lot .r{text-align:right;font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:6px;line-height:16px}
.pill.NA{background:var(--warn-bg);color:var(--warn-text)}
.pill.LT{background:var(--lt-soft);color:var(--lt)} .pill.ST{background:var(--st-soft);color:var(--st)} .pill.IN{background:var(--in-soft);color:var(--in)}
.muted{color:var(--muted)}
.badge[hidden]{display:none}
.holder{margin-top:12px}
.holder-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.holder-head .name{font-weight:700;font-size:17px}
.holder-head .broker{font-size:12px;color:var(--muted)}
.holder-head .net{margin-left:auto;font-weight:700;font-size:18px}
.bk{border-top:1px solid var(--border)}
.bk-head{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 6px;font-weight:650;font-size:14px}
.bk-foot{display:flex;gap:16px;justify-content:flex-end;flex-wrap:wrap;padding:8px 16px 12px;font-size:12.5px;color:var(--text-2)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 4px}
.tt{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.tt th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:4px 10px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.tt th:first-child,.tt td.sym{text-align:left;padding-left:16px}
.tt th:nth-child(6),.tt td:nth-child(6){text-align:left}
.tt th:last-child,.tt td:last-child{padding-right:16px}
.tt.buys th:nth-child(4),.tt.buys td:nth-child(4){text-align:right}
.tt td{padding:7px 10px;text-align:right}
.tt td.sym{font-weight:600;position:sticky;left:0;background:var(--surface)}
.tt tr.first + tr.first td,.tt tr.tot + tr.first td{border-top:1px dashed var(--border)}
.tt tr.more td{padding-top:2px}
.tt tr.tot td{font-size:12px;color:var(--text-2);font-weight:600;padding-top:2px}
.tt .pl{font-weight:650}
.tt .pc{display:inline-block;min-width:46px;margin-left:6px;font-size:11.5px;font-weight:500;color:var(--muted)}
.tt .held{font-size:12px;color:var(--text-2)}
.tt .d0{display:none}
.lt .d0{display:none}
.lt .ph{display:none}
.tt .tp{display:none}
.lt.log .bs{font-weight:700;font-size:10.5px;letter-spacing:.04em}
.lt.log .bs.B{color:var(--in)} .lt.log .bs.S{color:var(--lt)}
.lt.log tr.nd td{border-top:1px solid var(--border-strong)}
.lt.log tr:not(.nd) td{border-top:1px dashed var(--border)}
.lt.log .ph-only{display:none}
.lt.log th:nth-child(2),.lt.log td.sym{text-align:left}
.lt.log th:nth-child(3),.lt.log td:nth-child(3){text-align:center}
.log-fy{height:36px;border:1px solid var(--border-strong);border-radius:10px;padding:0 10px;font:inherit;font-size:13px;background:var(--surface);color:var(--text)}
/* ---------- stock lens ---------- */
.lens-tools{display:flex;gap:8px;align-items:center;margin:14px 0 10px;flex-wrap:wrap}
.lens-tools input{flex:1;min-width:140px;height:36px;border:1px solid var(--border-strong);border-radius:10px;padding:0 12px;font:inherit;font-size:14px;background:var(--surface);color:var(--text)}
.lt{width:100%;border-collapse:collapse;font-size:13.5px;white-space:nowrap}
.lt th{font-size:11px;font-weight:600;color:var(--muted);text-align:right;padding:8px 10px 6px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.lt th:first-child,.lt td:first-child{text-align:left;padding-left:16px;position:sticky;left:0;background:var(--surface)}
.lt th:last-child,.lt td:last-child{padding-right:16px}
.lt td{padding:9px 10px;text-align:right;border-top:1px dashed var(--border)}
.lt tr.row-s{cursor:pointer}
.lt tr.row-s:hover td{background:var(--surface-2)}
.lt td.sym{font-weight:600}
.lt .sub{display:block;font-size:11.5px;color:var(--muted);font-weight:500}
.lt .pl{font-weight:650}
.lt tr.det td{padding:0 0 10px;border-top:0;position:static;background:var(--surface)}
.ev{margin:0 16px;border-radius:10px;background:var(--surface-2);padding:4px 12px;font-size:12.5px}
.ev div{display:grid;grid-template-columns:74px 44px 1fr auto;gap:8px;padding:5px 0;align-items:baseline}
.ev div + div{border-top:1px solid var(--border)}
.ev .bs{font-weight:700;font-size:10.5px;letter-spacing:.04em}
.ev .bs.B{color:var(--in)} .ev .bs.S{color:var(--lt)}
.ev .r{text-align:right;font-weight:600}
.acct-foot{display:flex;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:4px}

/* ---------- calendar ---------- */
.month-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-bottom:12px}
.month-sum .stat:first-child{grid-column:1/-1}
.month-sum .stat:first-child .v{font-size:26px;font-weight:700}
.cal{padding:12px}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;border-radius:10px;min-height:58px;padding:6px 4px 5px;background:var(--surface-2);border:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;color:var(--text)}
.cell.blank{background:none;cursor:default}
.cell.none{cursor:default}
.cell .d{font-size:12px;color:var(--text-2);font-weight:500}
.cell .n{font-size:12px;font-weight:650;letter-spacing:-.01em}
.cell.sel{outline:2px solid var(--text);outline-offset:1px}
.cell.future{opacity:.4}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px}
.legend .ramp{display:flex;gap:2px}
.legend .ramp i{width:16px;height:10px;border-radius:3px;display:block}
.bars{padding:6px 0}
.bar-row{display:grid;grid-template-columns:44px 1fr 86px;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.bar-row:hover,.bar-row.sel{background:var(--surface-2)}
.bar-row .m{font-size:13px;color:var(--text-2);font-weight:500}
.bar-track{position:relative;height:16px}
.bar-track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-strong)}
.bar-track .b{position:absolute;top:2px;height:12px}
.bar-track .b.pos{left:50%;border-radius:0 4px 4px 0;background:var(--gain-fill)}
.bar-track .b.neg{right:50%;border-radius:4px 0 0 4px;background:var(--loss-fill)}
.bar-row .v{font-size:13px;font-weight:600;text-align:right}

/* ---------- tax ---------- */
.tax-card{padding:0}
.tax-head{display:flex;align-items:baseline;padding:14px 16px 6px}
.tax-head .name{font-weight:650;font-size:16px}
.tax-head .est{margin-left:auto;text-align:right}
.tax-head .est .k{font-size:12px;color:var(--muted)}
.tax-head .est .v{font-weight:700;font-size:17px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;font-size:14px;border-top:1px dashed var(--border)}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600}
.meter{margin:4px 16px 14px}
.meter .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:var(--lt)}
.meter .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}

<script src="pnl-data.js"></script>
<script>
'use strict';
const D = window.PNL_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- formatting ----------
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MINUS = '−';
const rs = n => '₹' + nf0.format(Math.round(Math.abs(n)));
const rsP = n => '₹' + nf2.format(n);
const rnd = n => Math.sign(n) * Math.round(Math.abs(n));
const signed = n => (rnd(n) > 0 ? '+' : rnd(n) < 0 ? MINUS : '') + rs(n);
const cls = n => rnd(n) > 0 ? 'gain' : rnd(n) < 0 ? 'loss' : 'flat';
function compact(n) {
  const a = Math.abs(n), s = n > 0 ? '+' : n < 0 ? MINUS : '';
  if (a >= 1e7) return s + (a / 1e7).toFixed(a >= 1e8 ? 0 : 2) + 'Cr';
  if (a >= 1e5) return s + (a / 1e5).toFixed(a >= 1e6 ? 1 : 2) + 'L';
  if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  return s + Math.round(a);
}
const pct = (gain, cost) => cost ? (gain >= 0 ? '+' : MINUS) + Math.abs(gain / cost * 100).toFixed(1) + '%' : '';
const dt = s => new Date(s + 'T00:00:00');
const fmtDay = s => dt(s).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = s => dt(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' });
const fmtMonth = m => dt(m + '-01').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
const monAbbr = m => dt(m + '-01').toLocaleDateString('en-IN', { month: 'short' });
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fyOf = date => { const y = +date.slice(0, 4), m = +date.slice(5, 7); const s = m >= 4 ? y : y - 1; return s; };
const fyLabel = s => `FY ${s}-${String(s + 1).slice(2)}`;
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
function ltDate(buy) { const d = dt(buy); d.setFullYear(d.getFullYear() + 1); d.setDate(d.getDate() + 1); return isoOf(d); }

// ---------- data indexes ----------
const ACC = Object.fromEntries(D.accounts.map(a => [a.id, a]));
const PERSON = Object.fromEntries(D.people.map(p => [p.id, p]));
const byDate = {};
for (const r of D.records) (byDate[r.date] = byDate[r.date] || []).push(r);
const allDates = Object.keys(byDate).sort();
for (const r of D.records) for (const s of r.sells) s.cost = s.lots.reduce((c, l) => c + l.q * l.p, 0);

// ---------- state ----------
const store = { get(k, d) { try { const v = localStorage.getItem('pnl.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('pnl.' + k, JSON.stringify(v)); } catch {} } };
// Top filter: each view is a set of accounts with this person's share of each (1 = whole account, 0.5 = half).
const VIEWS = D.views || D.people.map(p => ({ id: p.id, name: p.name,
  shares: Object.fromEntries(D.accounts.filter(a => a.person === p.id).map(a => [a.id, 1])) }));
const VIEW = Object.fromEntries(VIEWS.map(v => [v.id, v]));
const S = {
  tab: ['day', 'cal', 'tax', 'hold', 'lens', 'log'].includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('tab', 'day'),
  view: new URLSearchParams(location.search).get('view') || store.get('view', null), holder: store.get('holder', 'ALL'), broker: store.get('broker', 'ALL'),
  lensSort: store.get('lensSort', 'pnl'), lensQ: '', lensOpen: null, logQ: '', logSide: 'ALL', logFy: 'ALL', logN: 200,
  date: (q => /^\d{4}-\d{2}-\d{2}$/.test(q || '') ? q : D.asOf)(new URLSearchParams(location.search).get('date')), month: D.asOf.slice(0, 7), fy: fyOf(D.asOf), holdSort: store.get('holdSort', 'pnl'),
};
if (!VIEW[S.view]) S.view = VIEWS[0].id;
// top tabs are the partners (Anup, DD); PEW / JPW are reached through the holder tabs (or a ?view= link)
const TOP = VIEWS.filter(v => !D.people.some(p => p.id === v.id));
if (!TOP.some(v => v.id === S.view) && !new URLSearchParams(location.search).get('view')) S.view = TOP[0].id;   // an old saved PEW/JPW choice
const viewAccs = () => D.accounts.map(a => a.id).filter(id => VIEW[S.view].shares[id] > 0);
const holdersOf = () => [...new Set(viewAccs().map(id => ACC[id].person))];
const BROKERS = ['Zerodha', 'Angel One'];
function fixFilters() {
  if (S.holder !== 'ALL' && !holdersOf().includes(S.holder)) S.holder = 'ALL';
  if (holdersOf().length === 1) S.holder = holdersOf()[0];
  if (S.broker !== 'ALL' && !BROKERS.includes(S.broker)) S.broker = 'ALL';
}
fixFilters();

const shareOf = acc => VIEW[S.view].shares[acc] || 0;
function selAccounts() {
  return viewAccs().filter(id => (S.holder === 'ALL' || ACC[id].person === S.holder) && (S.broker === 'ALL' || ACC[id].broker === S.broker));
}
// Records and holdings scaled by the view's share of each account. Quantities are scaled, so every amount derived
// from them (values, gains) is the share too; `oq` keeps the real traded quantity for display.
const scaleLots = (lots, k) => lots.map(l => ({ ...l, q: l.q * k, oq: l.q }));
function scaleRec(r, k) {
  if (k === 1) return r;
  return { ...r, gross: r.gross * k, charges: r.charges * k, net: r.net * k,
    buys: r.buys.map(b => ({ ...b, q: b.q * k, oq: b.q })),
    sells: r.sells.map(s => ({ ...s, q: s.q * k, oq: s.q, gross: s.gross * k, cost: s.cost * k, lots: scaleLots(s.lots, k) })) };
}
let cacheKey = '', cache;
function V() {
  const key = S.view + '|' + S.holder + '|' + S.broker;
  if (key !== cacheKey) {
    const set = new Set(selAccounts());
    const records = D.records.filter(r => set.has(r.account)).map(r => scaleRec(r, shareOf(r.account)));
    const byD = {};
    for (const r of records) (byD[r.date] = byD[r.date] || []).push(r);
    const holdings = D.holdings.filter(h => set.has(h.account))
      .map(h => { const k = shareOf(h.account); return k === 1 ? h : { ...h, lots: scaleLots(h.lots, k) }; });
    cache = { set, records, byD, dates: Object.keys(byD).sort(), holdings }; cacheKey = key;
  }
  return cache;
}
const recsOn = date => V().byD[date] || [];
const selDates = () => V().dates;
const warnsOn = date => D.warnings.filter(w => w.date === date && V().set.has(w.account));
const qty = x => x.oq ?? x.q;
const pctTxt = k => Math.round(k * 100) + '%';
const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);

// ---------- icons ----------
const ICON = {
  prev: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
};
const alertHtml = w => `<div class="alert ${w.level === 'error' ? 'error' : 'warn'}" role="${w.level === 'error' ? 'alert' : 'status'}">${ICON.warn}

// ---------- Stock Lens: profit or loss per stock, all time, for the selected person / account / broker ----------
// Realised P&L is the share of each sale's gain before charges (charges are per day, not per stock). Buy prices come
// from the buy records plus the buy lots of sales and holdings (so buys from before the trade history count too).
function lensData() {
  const by = {};
  const S0 = sym => (by[sym] = by[sym] || { s: sym, realised: 0, cost: 0, sold: 0, bought: 0, buys: [], sells: [], seen: new Set(), held: 0, open: 0, openCost: 0, accounts: new Set() });
  const multi = new Set(selAccounts()).size > 1;
  const tag = acc => multi ? ACC[acc].label : '';
  for (const r of V().records) {
    for (const b of r.buys) { const x = S0(b.s); x.buys.push({ d: r.date, q: qty(b), p: b.p, acc: tag(r.account) }); x.seen.add(r.account + r.date + b.p); x.bought += qty(b); x.accounts.add(r.account); }
    for (const sl of r.sells) {
      const x = S0(sl.s); x.realised += sl.gross; x.cost += sl.cost || 0; x.sold += qty(sl); x.accounts.add(r.account);
      x.sells.push({ d: r.date, q: qty(sl), p: sl.p, g: sl.gross, acc: tag(r.account) });
      for (const l of sl.lots) if (l.p != null && l.d && !x.seen.has(r.account + l.d + l.p)) { x.seen.add(r.account + l.d + l.p); x.buys.push({ d: l.d, q: qty(l), p: l.p, acc: tag(r.account), lot: true }); }
    }
  }
  for (const h of V().holdings) {
    const x = S0(h.s); x.accounts.add(h.account);
    for (const l of h.lots) {
      x.held += qty(l); x.open += (h.ltp - l.p) * l.q; x.openCost += l.p * l.q;
      if (!x.seen.has(h.account + l.d + l.p)) { x.seen.add(h.account + l.d + l.p); x.buys.push({ d: l.d, q: qty(l), p: l.p, acc: tag(h.account), lot: true }); }
    }
  }
  const ext = (arr, f) => arr.length ? arr.reduce((m, e) => f(e.p, m.p) ? e : m) : null;
  return Object.values(by).map(x => {
    const paid = x.buys.filter(b => b.p > 0);   // bonus / demerger lots at ₹0 are not a buy price
    return { ...x, lowB: ext(paid, (a, b) => a < b), highB: ext(paid, (a, b) => a > b), lowS: ext(x.sells, (a, b) => a < b), highS: ext(x.sells, (a, b) => a > b) };
  });
}

// ---------- Trade Log: every buy and sale available for the selected person / account / broker, newest first ----------
// One line per stock per day and side (fills of the same day are combined at their average price).
function logRows() {
  const multi = new Set(selAccounts()).size > 1, out = [];
  for (const r of V().records) {

  out.sort((a, b) => b.d.localeCompare(a.d) || (a.k === b.k ? a.s.localeCompare(b.s) : a.k === 'S' ? -1 : 1));

  if (S.logFy !== 'ALL' && !fys.includes(S.logFy)) S.logFy = 'ALL';
  const q = S.logQ.trim().toUpperCase();
  const rows = all.filter(x => (S.logSide === 'ALL' || x.k === S.logSide) && (S.logFy === 'ALL' || String(fyOf(x.d)) === S.logFy) && (!q || x.s.includes(q)));

// ---------- Tax ----------
// Equity capital gains: sales before 23 Jul 2024 → STCG 15%, LTCG 10%; from 23 Jul 2024 → STCG 20%, LTCG 12.5%.
// LTCG exemption is per person per FY: ₹1.25 lakh from FY 2024-25. Short-term losses offset both; long-term losses only LTCG.
const NEW_RATES_FROM = '2024-07-23';
function taxFor(personId, fy) {
  const accs = new Set(selAccounts().filter(a => ACC[a].person === personId));
  const t = { stOld: 0, stNew: 0, ltOld: 0, ltNew: 0, intra: 0, charges: 0, byAcc: {} };
  for (const r of D.records) {
    if (!accs.has(r.account) || fyOf(r.date) !== fy) continue;
    t.charges += r.charges;
    const b = t.byAcc[r.account] = t.byAcc[r.account] || { st: 0, lt: 0, intra: 0 };
    const nw = r.date >= NEW_RATES_FROM;
    for (const s of r.sells) for (const l of s.lots) {
      if (l.p == null) continue; // cost unknown: not counted until the buy is imported
      const g = (s.p - l.p) * l.q;
      if (l.t === 'IN') { t.intra += g; b.intra += g; }
      else if (l.t === 'ST') { nw ? t.stNew += g : t.stOld += g; b.st += g; }
      else { nw ? t.ltNew += g : t.ltOld += g; b.lt += g; }
    }
  }
  t.st = t.stOld + t.stNew; t.lt = t.ltOld + t.ltNew;
  // set-off: a net short-term loss reduces long-term gains
  let st = t.st, lt = t.lt;
  if (st < 0) { lt += st; st = 0; }
  t.exemption = fy >= 2024 ? 125000 : 100000;
  const ltTaxable = Math.max(0, lt - t.exemption);
  const stRate = t.st > 0 ? (t.stOld * 0.15 + t.stNew * 0.20) / t.st : 0.20;
  const ltRate = t.lt > 0 && t.ltOld > 0 ? (t.ltOld * 0.10 + t.ltNew * 0.125) / t.lt : 0.125;
  t.tax = Math.max(0, st) * stRate + ltTaxable * ltRate;
  t.ltNetted = lt; t.exemptUsed = Math.min(t.exemption, Math.max(0, lt));
  t.share = Math.max(0, ...[...accs].map(shareOf));
  if (t.share !== 1) {
    for (const f of ['stOld', 'stNew', 'ltOld', 'ltNew', 'intra', 'charges', 'st', 'lt', 'tax']) t[f] *= t.share;
    for (const b of Object.values(t.byAcc)) { b.st *= t.share; b.lt *= t.share; b.intra *= t.share; }
  }
  return t;
}

  h += `<div class="card"><div class="hero"><div class="label">Realised gains · ${fyLabel(S.fy)}${S.fy === fyOf(D.asOf) ? ' so far' : ''}</div>

    h += `<div class="card tax-card"><div class="tax-head"><div class="name">${esc(p.name)}${t.share < 1 ? `<span class="share">${pctTxt(t.share)} share</span>` : ''}</div>

      <div class="kv"><span class="k"><span class="pill LT">LT</span> Long-term gains</span><span class="v num ${cls(t.lt)}">${signed(t.lt)}</span></div>
      <div class="kv"><span class="k"><span class="pill IN">INTRADAY</span> Speculative</span><span class="v num ${cls(t.intra)}">${signed(t.intra)}</span></div>

    </div>`;
  }
  h += `</div><p class="note">Estimates only, not tax advice. Rates: STCG 20% and LTCG 12.5% above ₹1.25 lakh per person (15% / 10% for sales before 23 Jul 2024).
    A net short-term loss is set off against long-term gains. Intraday gains are speculative income, taxed at your slab rate, so they're not in the estimate.
    Gains are before charges; brokerage and exchange charges can be deducted, STT can't.
    ${all.some(e => e[1].share < 1) ? ' For a partner\'s share, tax is worked out on the account holder\'s full gains and then split by share; the exemption bar shows the holder\'s full usage.' : ''}</p>`;
  $('#v-tax').innerHTML = h;
  $('#v-tax').querySelectorAll('[data-fy]').forEach(b => b.onclick = () => { S.fy = +b.dataset.fy; render(); });

      <div class="r"><div class="v num ${cls(x.pnl)}">${signed(x.pnl)}</div><div class="p num">${pct(x.pnl, x.cost)}</div></div></div></summary>

// ---------- data status: is the data fresh, did the last run work, does anything need a look ----------
// The job runs at 11:45 PM IST Mon–Fri (broker API + email) and 8:00 AM IST Tue–Sat (late contract notes). GitHub can start late, so allow 75 minutes.
const IST = 5.5 * 3600e3, GRACE = 75 * 60e3;
function lastExpectedRun(now = Date.now()) {
  for (let back = 0; back < 8; back++) {
    const d = new Date(now + IST - back * 86400e3), dow = d.getUTCDay();
    const day = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) - IST;   // 00:00 IST of that day
    const slots = [];
    if (dow >= 1 && dow <= 5) slots.push(day + 23.75 * 3600e3);   // 11:45 PM Mon–Fri: broker API + notes + the daily email
    if (dow >= 2 && dow <= 6) slots.push(day + 8 * 3600e3);       // 8:00 AM Tue–Sat: late contract notes
    for (const t of slots.sort((a, b) => b - a)) if (t + GRACE <= now) return t;
  }
  return 0;
}
const fmtWhen = iso => new Date(iso).toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit', timeZone: 'Asia/Kolkata' });
const accLabel = id => id ? (ACC[id] ? ACC[id].label : id) : 'All accounts';
function dataStatus() {
  const st = D.status || {}, run = st.lastRun;
  const gen = Date.parse(D.generatedAt || 0), expected = lastExpectedRun();
  const stale = !D.sample && expected && gen < expected - 10 * 60e3;
  const runErrors = run && !run.ok ? run.errors || [] : [];
  const issues = (st.issues || []).filter(w => !runErrors.some(e => e.text && w.text && w.text.includes(e.text)));
  const level = runErrors.length || issues.some(w => w.level === 'error') ? 'error' : stale || issues.length ? 'warn' : 'ok';
  return { st, run, gen, expected, stale, runErrors, issues, level };
}
function renderStatus() {
  const x = dataStatus();
  const pill = $('#statusPill');
  pill.className = 'status-pill ' + x.level;
  pill.innerHTML = `<span class="dot"></span><span>${x.level === 'ok' ? 'Updated' : x.level === 'error' ? 'Problem ·' : x.stale ? 'Not updated ·' : 'Check ·'}<br><b>${D.generatedAt ? fmtWhen(D.generatedAt) : fmtShort(D.asOf)}</b></span>`;
  pill.title = 'Data status: tap for details';
  const lines = [];
  if (x.stale) lines.push(`<li><b>Data not updated since ${fmtWhen(D.generatedAt)}.</b> The run due at ${fmtWhen(new Date(x.expected).toISOString())} hasn't published — the daily job may have failed or not run.</li>`);
  for (const e of x.runErrors) lines.push(`<li><b>${esc(accLabel(e.account))}:</b> ${esc(e.text)} <span class="muted">(${x.run.mode} run, ${fmtWhen(x.run.at)})</span></li>`);
  const errs = x.issues.filter(w => w.level === 'error'), warns = x.issues.filter(w => w.level !== 'error');
  for (const w of errs) lines.push(`<li><b>${esc(accLabel(w.account))}:</b> ${esc(w.text)}</li>`);
  if (warns.length) lines.push(`<li>${warns.length} check${warns.length > 1 ? 's' : ''} need${warns.length > 1 ? '' : 's'} a look (holdings or buy records) — tap for the list.</li>`);
  $('#statusBar').innerHTML = x.level === 'ok' ? '' : `<div class="alert ${x.level}" role="${x.level === 'error' ? 'alert' : 'status'}">${ICON.warn}
    <div><b>${x.level === 'error' ? 'Something went wrong with the data' : x.stale ? 'The data is out of date' : 'Some checks need a look'}</b><ul>${lines.join('')}</ul></div></div>`;
  const bar = $('#statusBar .alert'); if (bar) bar.onclick = () => togglePanel(true);
  if (!$('#statusPanel').hidden) renderPanel(x);
}
function renderPanel(x = dataStatus()) {
  const day = d => d ? fmtShort(d) : '—';
  const latestDay = D.asOf;
  const fresh = (x.st.accounts || []).map(a => {
    const lastIn = [a.lastApi, a.lastNote, a.lastTrade].filter(Boolean).sort().pop();
    return `<tr><td>${esc(accLabel(a.account))}</td><td>${day(a.lastApi)}</td><td>${day(a.lastNote)}</td><td>${day(a.lastTrade)}</td><td>${day(a.holdingsAsOf)}</td>
      <td>${ACC[a.account] && ACC[a.account].broker === 'Angel One' && a.lastApi && a.lastApi < latestDay ? '<span class="old">API behind</span>' : '<span class="ok">OK</span>'}</td></tr>`;
  }).join('');
  const runs = [...(x.st.runs || [])].reverse().slice(0, 8).map(r => `<tr><td>${fmtWhen(r.at)}</td><td>${r.mode}</td><td>${r.ok ? '<span class="ok">OK</span>' : '<span class="bad">' + (r.errors || []).length + ' error' + ((r.errors || []).length === 1 ? '' : 's') + '</span>'}</td>
    <td>${r.fetched ? Object.entries(r.fetched).map(([k, v]) => `${esc(accLabel(k).replace(' · Angel', ''))}: ${v.ok ? v.trades + ' fills' : 'failed'}`).join(', ') : '—'}</td>
    <td>${r.notes ? `${r.notes.read} notes${r.notes.added ? ', ' + r.notes.added + ' new trades' : ''}${r.notes.filled && r.notes.filled.length ? ', filled ' + r.notes.filled.map(f => f.date).join(' ') : ''}` : '—'}</td></tr>`).join('');
  const issues = x.issues.map(w => `<li><b>${esc(accLabel(w.account))}</b> (${fmtShort(w.date)}): ${esc(w.text)}</li>`).join('');
  $('#statusPanel').innerHTML = `
    <h3>Data</h3><ul><li>Page data built <b>${D.generatedAt ? fmtWhen(D.generatedAt) : '—'}</b>, covering trades up to <b>${fmtShort(D.asOf)}</b>.</li>
      ${x.expected ? `<li>Last scheduled run due ${fmtWhen(new Date(x.expected).toISOString())}: ${x.stale ? '<span class="bad">missing</span>' : '<span class="ok">done</span>'}.</li>` : ''}</ul>
    <h3>Accounts</h3><div class="tw"><table><thead><tr><th>Account</th><th>Broker API</th><th>Contract note</th><th>Last trade</th><th>Holdings</th><th></th></tr></thead><tbody>${fresh}</tbody></table></div>
    <h3>Recent runs</h3>${runs ? `<div class="tw"><table><thead><tr><th>When</th><th>Run</th><th>Result</th><th>Broker API</th><th>Contract notes</th></tr></thead><tbody>${runs}</tbody></table></div>` : '<ul><li>No runs logged yet.</li></ul>'}
    <h3>Open checks</h3>${issues ? `<ul>${issues}</ul>` : '<ul><li>None.</li></ul>'}
    <div style="text-align:right;padding:0 12px 6px"><button class="link-btn" id="statusClose">Close</button></div>`;
  $('#statusClose').onclick = () => togglePanel(false);
}
function togglePanel(open) {
  const p = $('#statusPanel'); p.hidden = !open; $('#statusPill').setAttribute('aria-expanded', String(open));
  if (open) { renderPanel(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
}
$('#statusPill').onclick = () => togglePanel($('#statusPanel').hidden);
setInterval(renderStatus, 5 * 60e3);   // a page left open turns amber once a run is overdue
renderStatus();
$('#sampleBadge').hidden = !D.sample;
render();

// ---------- phone view: the page itself in a 390px-wide iframe, so the real mobile layout applies ----------
const embedded = window.self !== window.top;
if (embedded) document.documentElement.classList.add('embedded');
function phoneView(on) {
  $('#phoneView').hidden = !on;
  document.body.style.overflow = on ? 'hidden' : '';
  store.set('phone', on);
  if (on) { $('#pvIframe').src = location.pathname + '#' + S.tab; return; }
  $('#pvIframe').src = 'about:blank';
  // pick up the filter and tab chosen inside the phone view
  const v = store.get('view', S.view), t = store.get('tab', S.tab);
  if (VIEW[v]) S.view = v;
  S.holder = store.get('holder', 'ALL'); S.broker = store.get('broker', 'ALL'); fixFilters();
  if (['day', 'cal', 'tax', 'hold', 'lens', 'log'].includes(t)) { S.tab = t; history.replaceState(null, '', '#' + t); }
  render();
}
$('#phoneBtn').onclick = () => phoneView(true);
$('#pvClose').onclick = () => phoneView(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#phoneView').hidden) phoneView(false); });
if (!embedded && store.get('phone', false) && matchMedia('(min-width:760px)').matches && location.hash !== '#selftest') phoneView(true);

// ---------- self test: open with #selftest ----------
if (location.hash === '#selftest') {
  const out = [], ok = (c, m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
  ok(D && D.records.length > 0, 'data loaded: ' + D.records.length + ' day-records');
  let lotQty = true, gross = true, net = true;
  for (const r of D.records) {
    for (const s of r.sells) {
      if (sum(s.lots, l => l.q) !== s.q) lotQty = false;
      if (Math.abs(sum(s.lots, l => l.p == null ? 0 : (s.p - l.p) * l.q) - s.gross) > 0.05) gross = false;
    }
    if (Math.abs(r.gross - r.charges - r.net) > 0.05) net = false;
  }
  ok(lotQty, 'every sell quantity equals the sum of its FIFO lots');
  ok(gross, 'every sell gross equals the sum of its lot gains');
  ok(net, 'every day: gross − charges = net');
  // Angel's reports already count a sale on the 1-year anniversary as long-term, so allow one day's difference
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => l.t !== 'LT' || daysBetween(r.date, ltDate(l.d)) <= 1))), 'long-term lots were held 12 months or more');
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => l.t !== 'ST' || r.date < ltDate(l.d)))), 'short-term lots were held 12 months or less');
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => (l.t === 'NA') === (l.p == null)))), 'unknown-cost lots are marked NA');
  for (const t of ['day', 'cal', 'tax', 'hold', 'lens', 'log']) {
    try { S.tab = t; render(); ok($('#v-' + t).innerHTML.length > 200, 'view renders: ' + t); } catch (e) { ok(false, 'view ' + t + ': ' + e.message); }
  }
  S.view = 'DD'; S.holder = 'PEW'; S.broker = 'Angel One'; S.tab = 'day'; render();
  ok(selAccounts().join() === 'PEW-ANGEL' && V().records.every(r => r.account === 'PEW-ANGEL'), 'holder + broker tabs limit records');
  const netOf = v => { S.view = v; S.holder = 'ALL'; S.broker = 'ALL'; fixFilters(); return sum(V().records, r => r.net); };
  const pew = netOf('PEW'), jpw = netOf('JPW');
  ok(Math.abs(netOf('ANUP') - pew / 2) < 1, 'Anup = 50% of PEW');
  ok(Math.abs(netOf('DD') - (jpw + pew / 2)) < 1, 'DD = 100% of JPW + 50% of PEW');
  ok(Math.abs(netOf('ANUP') + netOf('DD') - (pew + jpw)) < 1, 'Anup + DD = PEW + JPW');
  try { for (const v of ['ANUP', 'DD']) for (const hb of [['ALL', 'ALL'], ['PEW', 'Zerodha'], ['JPW', 'Angel One']]) for (const t of ['day', 'cal', 'tax', 'hold', 'lens', 'log']) { S.view = v; [S.holder, S.broker] = hb; fixFilters(); S.tab = t; render(); } ok(true, 'Anup and DD views render'); }
  catch (e) { ok(false, 'share views: ' + e.message); }
  S.view = 'DD'; S.holder = 'ALL'; S.broker = 'ALL'; fixFilters(); S.tab = 'lens'; render();
  ok($('#v-lens').innerHTML.length > 200 && Math.abs(sum(lensData(), x => x.realised) - sum(V().records, r => r.gross)) < 1, 'Stock Lens renders and its total = sum of day gross');
  S.tab = 'log'; render();
  ok(logRows().rows.length === sum(V().records, r => r.buys.length + r.sells.length) && $('#v-log').innerHTML.length > 200, 'Trade Log lists every buy and sale');
  ok(Math.abs(sum(D.accounts.map(a => a.id), id => sum(D.records.filter(r => r.account === id), r => r.net)) - sum(D.records, r => r.net)) < 1, 'per-account totals add up to the family total');
  ok(compact(125000) === '+1.25L' && compact(-4500) === MINUS + '4.5k' && compact(12500000) === '+1.25Cr', 'compact INR format');
  ok(document.documentElement.scrollWidth <= window.innerWidth + 1, 'no horizontal page scroll at ' + window.innerWidth + 'px');
  phoneView(true); ok(!$('#phoneView').hidden && $('#pvIframe').getAttribute('src').endsWith('#' + S.tab), 'phone view opens the page in a frame');
  phoneView(false); ok($('#phoneView').hidden, 'phone view closes'); store.set('phone', false);
  S.view = TOP[0].id; S.holder = 'ALL'; S.broker = 'ALL'; fixFilters();
  for (const v of ['day', 'cal', 'tax', 'hold', 'lens', 'log']) $('#v-' + v).hidden = true;
  const st = $('#selftest'); st.hidden = false; st.textContent = out.join('\n');
}
</script>
