<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111317" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex, nofollow">
<title>Family P&amp;L</title>
<style>
:root{
  color-scheme: light;
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f1f3f6; --border:#e3e6eb; --border-strong:#cfd4dc;
  --text:#14171c; --text-2:#4d535c; --muted:#767d88;
  --accent:#2a78d6; --accent-soft:#e3eefc;
  --gain:#0b7a3e; --loss:#c8352f;
  --gain-fill:#12a150; --loss-fill:#e34948; --zero-fill:#f0efec;
  --warn-bg:#fff5df; --warn-border:#f1c46b; --warn-text:#6b4b00;
  --err-bg:#fdecea; --err-border:#f0a29d; --err-text:#7d1f1a;
  --lt:#6250d6; --lt-soft:#ecebfb; --st:#2a78d6; --st-soft:#e3eefc; --in:#a05a00; --in-soft:#fbefdc;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.05);
  --radius:14px; --nav-h:62px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#111317; --surface:#1a1d22; --surface-2:#22262c; --border:#2c3138; --border-strong:#3a4049;
    --text:#eef0f3; --text-2:#c0c5cc; --muted:#8f96a1;
    --accent:#5a9cf0; --accent-soft:#1d2d44;
    --gain:#4cc983; --loss:#ff7b73;
    --gain-fill:#1f9d58; --loss-fill:#e66767; --zero-fill:#383835;
    --warn-bg:#2e2410; --warn-border:#7a5a17; --warn-text:#f3d58c;
    --err-bg:#341a19; --err-border:#80322d; --err-text:#ffb4ad;
    --lt:#a99ff2; --lt-soft:#2a2650; --st:#79b1f3; --st-soft:#1d2d44; --in:#f0b35c; --in-soft:#3a2a12;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#111317; --surface:#1a1d22; --surface-2:#22262c; --border:#2c3138; --border-strong:#3a4049;
  --text:#eef0f3; --text-2:#c0c5cc; --muted:#8f96a1;
  --accent:#5a9cf0; --accent-soft:#1d2d44;
  --gain:#4cc983; --loss:#ff7b73;
  --gain-fill:#1f9d58; --loss-fill:#e66767; --zero-fill:#383835;
  --warn-bg:#2e2410; --warn-border:#7a5a17; --warn-text:#f3d58c;
  --err-bg:#341a19; --err-border:#80322d; --err-text:#ffb4ad;
  --lt:#a99ff2; --lt-soft:#2a2650; --st:#79b1f3; --st-soft:#1d2d44; --in:#f0b35c; --in-soft:#3a2a12;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
  -webkit-tap-highlight-color:transparent;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 16px)}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.gain{color:var(--gain)} .loss{color:var(--loss)} .flat{color:var(--text-2)}
.muted{color:var(--muted)} .t2{color:var(--text-2)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border)}
.head-row{display:flex;align-items:center;gap:10px;padding:10px 16px 6px;max-width:1180px;margin:0 auto}
.brand{font-weight:700;font-size:18px;letter-spacing:-.01em}
.asof{font-size:12px;color:var(--muted);margin-left:auto;text-align:right;line-height:1.25}
.badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--warn-bg);color:var(--warn-text);border:1px solid var(--warn-border);vertical-align:2px;margin-left:6px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 10px;max-width:1180px;margin:0 auto}
.chips::-webkit-scrollbar{display:none}
.chips[hidden]{display:none}
.share-note{max-width:1180px;margin:0 auto;padding:0 16px 10px;font-size:12.5px;color:var(--text-2)}
.share-note b{color:var(--text);font-weight:600}
.share{display:inline-block;font-size:11px;font-weight:600;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:4px;line-height:17px}
.chip{flex:none;min-height:36px;padding:6px 14px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface);
  font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.chip.sub{min-height:32px;font-size:13px;padding:4px 12px}
.chip.sub[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.chips .sep{flex:none;width:1px;background:var(--border-strong);margin:4px 2px}

/* ---------- nav ---------- */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--border);
  padding-bottom:var(--safe-b);height:calc(var(--nav-h) + var(--safe-b))}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;padding:6px 0}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding:14px 16px}
.view[hidden]{display:none}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 2px 10px}

/* ---------- date / month pager ---------- */
.pager{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pager .icon-btn{flex:none}
.icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pager-label{flex:1;min-width:0;height:44px;border-radius:12px;border:1px solid var(--border);background:var(--surface);position:relative;
  display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;gap:8px}
.pager-label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.link-btn{border:0;background:none;color:var(--accent);font-weight:600;font-size:13px;cursor:pointer;padding:8px 4px}

/* ---------- hero ---------- */
.hero{padding:18px 18px 16px}
.hero .label{font-size:13px;color:var(--text-2);font-weight:500}
.hero .big{font-size:38px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}
.hero .sub{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--border);border-top:1px solid var(--border);border-radius:0 0 var(--radius) var(--radius);overflow:hidden}
.stat{background:var(--surface);padding:11px 16px}
.stat .k{font-size:12px;color:var(--muted)}
.stat .v{font-size:16px;font-weight:600}

/* ---------- alerts ---------- */
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin:12px 0 0;font-size:14px;border:1px solid}
.alert.warn{background:var(--warn-bg);border-color:var(--warn-border);color:var(--warn-text)}
.alert.error{background:var(--err-bg);border-color:var(--err-border);color:var(--err-text)}
.alert b{font-weight:600}
.alert svg{flex:none;width:18px;height:18px;margin-top:1px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- account cards ---------- */
.grid{display:grid;gap:12px;grid-template-columns:1fr}
.acct-head{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
.acct-head .name{font-weight:650;font-size:16px}
.acct-head .broker{font-size:12px;color:var(--muted)}
.acct-head .net{margin-left:auto;font-weight:700;font-size:17px}
.sec-label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:8px 16px 4px;border-top:1px solid var(--border)}
.row{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.row + .row{border-top:1px dashed var(--border)}
.row .l{min-width:0;flex:1}
.row .sym{font-weight:600;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.row .meta{font-size:13px;color:var(--text-2)}
.row .r{text-align:right;flex:none}
.row .r .v{font-weight:650;font-size:15px}
.row .r .p{font-size:12px;color:var(--muted)}
details.sell{border-top:1px dashed var(--border)}
.sec-label + details.sell{border-top:0}
details.sell > summary{list-style:none;cursor:pointer}
details.sell > summary::-webkit-details-marker{display:none}
details.sell > summary .row{border:0}
.chev{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .15s}
details[open] .chev{transform:rotate(90deg)}
.lots{margin:0 16px 12px 16px;border-radius:10px;background:var(--surface-2);padding:4px 12px}
.lot{display:flex;gap:10px;align-items:center;padding:8px 0;font-size:13px}
.lot + .lot{border-top:1px solid var(--border)}
.lot .l{flex:1;min-width:0;color:var(--text-2)}
.lot .r{text-align:right;font-weight:600}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:6px;line-height:16px}
.pill.NA{background:var(--warn-bg);color:var(--warn-text)}
.pill.LT{background:var(--lt-soft);color:var(--lt)} .pill.ST{background:var(--st-soft);color:var(--st)} .pill.IN{background:var(--in-soft);color:var(--in)}
.acct-foot{display:flex;justify-content:space-between;padding:10px 16px 12px;border-top:1px solid var(--border);font-size:13px;color:var(--text-2)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--text-2);font-size:15px;margin-bottom:4px}

/* ---------- calendar ---------- */
.month-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);margin-bottom:12px}
.month-sum .stat:first-child{grid-column:1/-1}
.month-sum .stat:first-child .v{font-size:26px;font-weight:700}
.cal{padding:12px}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.cal-dow{font-size:11px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:2px}
.cell{position:relative;border-radius:10px;min-height:58px;padding:6px 4px 5px;background:var(--surface-2);border:0;display:flex;flex-direction:column;align-items:center;justify-content:space-between;cursor:pointer;color:var(--text)}
.cell.blank{background:none;cursor:default}
.cell.none{cursor:default}
.cell .d{font-size:12px;color:var(--text-2);font-weight:500}
.cell .n{font-size:12px;font-weight:650;letter-spacing:-.01em}
.cell.sel{outline:2px solid var(--text);outline-offset:1px}
.cell.future{opacity:.4}
.legend{display:flex;align-items:center;gap:8px;justify-content:center;font-size:12px;color:var(--muted);margin-top:12px}
.legend .ramp{display:flex;gap:2px}
.legend .ramp i{width:16px;height:10px;border-radius:3px;display:block}
.bars{padding:6px 0}
.bar-row{display:grid;grid-template-columns:44px 1fr 86px;align-items:center;gap:10px;padding:7px 14px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.bar-row:hover,.bar-row.sel{background:var(--surface-2)}
.bar-row .m{font-size:13px;color:var(--text-2);font-weight:500}
.bar-track{position:relative;height:16px}
.bar-track .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--border-strong)}
.bar-track .b{position:absolute;top:2px;height:12px}
.bar-track .b.pos{left:50%;border-radius:0 4px 4px 0;background:var(--gain-fill)}
.bar-track .b.neg{right:50%;border-radius:4px 0 0 4px;background:var(--loss-fill)}
.bar-row .v{font-size:13px;font-weight:600;text-align:right}

/* ---------- tax ---------- */
.tax-card{padding:0}
.tax-head{display:flex;align-items:baseline;padding:14px 16px 6px}
.tax-head .name{font-weight:650;font-size:16px}
.tax-head .est{margin-left:auto;text-align:right}
.tax-head .est .k{font-size:12px;color:var(--muted)}
.tax-head .est .v{font-weight:700;font-size:17px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 16px;font-size:14px;border-top:1px dashed var(--border)}
.kv .k{color:var(--text-2)}
.kv .v{font-weight:600}
.meter{margin:4px 16px 14px}
.meter .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter .fill{height:100%;border-radius:99px;background:var(--lt)}
.meter .cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.note{font-size:12.5px;color:var(--muted);margin:14px 2px 0;line-height:1.5}

/* ---------- holdings ---------- */
.soon .row{min-height:52px}
.days-left{font-size:12px;font-weight:600;color:var(--lt)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--surface);padding:6px 10px;font-size:12.5px;font-weight:500;cursor:pointer;min-height:32px}
.seg button[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.h2-row{display:flex;align-items:center;margin:22px 2px 10px}
.h2-row h2{margin:0}

/* ---------- smoothness ---------- */
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
.chip,.seg button,nav.tabs button,.icon-btn,.cell,.bar-row{transition:background-color .15s,color .15s,border-color .15s,transform .1s}
.chip:active,.icon-btn:active:not(:disabled),.cell:active,nav.tabs button:active,.seg button:active{transform:scale(.96)}
.view:not([hidden]){animation:viewIn .18s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
details.sell[open] .lots{animation:viewIn .15s ease-out}

/* ---------- compact phone sizes ---------- */
@media (max-width:759px){
  :root{--radius:12px;--nav-h:54px;--shadow:0 1px 2px rgba(16,24,40,.05)}
  body{font-size:13.5px}
  .head-row{padding:8px 14px 4px;gap:8px}
  .brand{font-size:16px}
  .asof{font-size:10.5px}
  .badge{font-size:9.5px;padding:1px 6px;margin-left:5px;vertical-align:1px}
  .chips{gap:6px;padding:3px 14px 7px}
  .chip{min-height:30px;padding:4px 13px;font-size:13px}
  .chip.sub{min-height:26px;padding:2px 10px;font-size:12px}
  .share-note{padding:0 14px 8px;font-size:11.5px}
  .share{font-size:10px;line-height:15px;padding:0 5px}
  nav.tabs button{font-size:10.5px;gap:2px}
  nav.tabs svg{width:20px;height:20px}
  main{padding:10px 12px}
  h2{font-size:10.5px;margin:16px 2px 7px}
  .pager{gap:6px;margin-bottom:10px}
  .icon-btn{width:36px;height:36px;border-radius:10px}
  .icon-btn svg{width:17px;height:17px}
  .pager-label{height:36px;border-radius:10px;font-size:13.5px}
  .link-btn{font-size:12px;padding:4px}
  .hero{padding:13px 14px 11px}
  .hero .label{font-size:11.5px}
  .hero .big{font-size:28px;margin:2px 0 1px}
  .hero .sub{font-size:11.5px}
  .stat{padding:8px 14px}
  .stat .k{font-size:10.5px}
  .stat .v{font-size:14px}
  .alert{font-size:12px;padding:8px 11px;gap:8px;border-radius:10px;margin-top:10px;line-height:1.4}
  .alert svg{width:15px;height:15px}
  .grid{gap:10px}
  .acct-head{padding:10px 14px 7px}
  .acct-head .name{font-size:14px}
  .acct-head .broker{font-size:11px}
  .acct-head .net{font-size:15px}
  .sec-label{font-size:10px;padding:6px 14px 2px}
  .row{padding:7px 14px;min-height:44px;gap:8px}
  .row .sym{font-size:13.5px;gap:5px}
  .row .meta{font-size:11.5px}
  .row .r .v{font-size:13.5px}
  .row .r .p{font-size:10.5px}
  .chev{width:14px;height:14px}
  .lots{margin:0 14px 9px;padding:2px 10px;border-radius:8px}
  .lot{font-size:11.5px;padding:6px 0;gap:8px}
  .pill{font-size:9px;line-height:14px;padding:0 5px;border-radius:5px}
  .acct-foot{font-size:11.5px;padding:7px 14px 9px}
  .empty{padding:20px 14px}
  .empty b{font-size:13.5px}
  .month-sum{margin-bottom:10px}
  .month-sum .stat:first-child .v{font-size:22px}
  .cal{padding:10px}
  .cal-grid{gap:5px}
  .cal-dow{font-size:10px}
  .cell{min-height:48px;border-radius:8px;padding:5px 3px 4px}
  .cell .d{font-size:10.5px}
  .cell .n{font-size:11px}
  .legend{font-size:11px;margin-top:10px}
  .bar-row{padding:5px 12px;grid-template-columns:38px 1fr 70px;gap:8px}
  .bar-row .m,.bar-row .v{font-size:12px}
  .tax-head{padding:10px 14px 4px}
  .tax-head .name{font-size:14px}
  .tax-head .est .k{font-size:10.5px}
  .tax-head .est .v{font-size:15px}
  .kv{padding:7px 14px;font-size:12.5px}
  .meter{margin:4px 14px 11px}
  .meter .cap{font-size:10.5px}
  .note{font-size:11px}
  .days-left{font-size:11px}
  .seg button{font-size:11.5px;padding:4px 9px;min-height:28px}
}

/* ---------- phone view (laptop only) ---------- */
.phone-btn{display:none;width:38px;height:38px;flex:none;color:var(--text-2)}
.phone-btn svg{stroke-width:1.8}
@media (min-width:760px){ .phone-btn{display:grid} }
html.embedded .phone-btn{display:none!important}
#phoneView{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 16px 20px;
  background:color-mix(in srgb,var(--bg) 55%,#000)}
#phoneView[hidden]{display:none}
.pv-bar{display:flex;align-items:center;gap:14px;color:#fff;font-size:13px;font-weight:500}
.pv-close{border:0;border-radius:999px;padding:8px 14px;background:#fff;color:#14171c;font-weight:600;font-size:13px;cursor:pointer}
.pv-close kbd{font:11px ui-monospace,Menlo,monospace;color:#767d88;margin-left:4px}
.pv-frame{width:410px;height:min(864px,calc(100vh - 80px));border-radius:44px;border:10px solid #15171b;overflow:hidden;
  background:var(--bg);box-shadow:0 24px 70px rgba(0,0,0,.45)}
.pv-frame iframe{width:100%;height:100%;border:0;display:block}

/* ---------- self test ---------- */
#selftest{white-space:pre-wrap;font:12px/1.5 ui-monospace,Menlo,monospace;padding:12px}

/* ---------- wider screens ---------- */
@media (min-width:760px){
  body{padding-bottom:24px}
  nav.tabs{position:static;height:auto;border-top:0;padding:0 16px 8px;background:transparent;max-width:1180px;margin:0 auto;gap:6px;justify-content:flex-start}
  nav.tabs button{flex:none;flex-direction:row;gap:7px;font-size:14px;padding:8px 14px;border-radius:10px}
  nav.tabs svg{width:18px;height:18px}
  nav.tabs button[aria-current="page"]{background:var(--accent-soft)}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .stats{grid-template-columns:repeat(4,1fr)}
  .hero-wrap{display:grid;grid-template-columns:1fr}
  .cell{min-height:72px;padding:8px 6px}
  .cell .n{font-size:13.5px}
  .cal-layout{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;align-items:start}
  .cal-layout h2:first-child{margin-top:0}
  .month-sum{grid-template-columns:repeat(4,1fr)}
  .month-sum .stat:first-child{grid-column:auto}
  .month-sum .stat:first-child .v{font-size:20px}
}
@media (min-width:1100px){
  .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (hover:hover){ .chip:hover{border-color:var(--text-2)} .cell:not(.blank):not(.none):hover{outline:2px solid var(--border-strong)} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
</style>
</head>
<body>
<header>
  <div class="head-row">
    <div class="brand">Family P&amp;L<span class="badge" id="sampleBadge" hidden>Sample data</span></div>
    <div class="asof" id="asof"></div>
    <button class="icon-btn phone-btn" id="phoneBtn" title="Phone view" aria-label="Show phone view">
      <svg viewBox="0 0 24 24"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg></button>
  </div>
  <div class="chips" id="people" role="group" aria-label="Person"></div>
  <div class="chips" id="accts" role="group" aria-label="Account" hidden></div>
  <div class="share-note" id="shareNote" hidden></div>
  <nav class="tabs" id="tabs" aria-label="Views">
    <button data-tab="day"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>Day</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
    <button data-tab="tax"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Tax</button>
    <button data-tab="hold"><svg viewBox="0 0 24 24"><path d="M4 7h16v13H4z"/><path d="M9 7V4h6v3"/></svg>Holdings</button>
  </nav>
</header>

<main>
  <section class="view" id="v-day"></section>
  <section class="view" id="v-cal" hidden></section>
  <section class="view" id="v-tax" hidden></section>
  <section class="view" id="v-hold" hidden></section>
  <section class="view card" id="selftest" hidden></section>
</main>

<div id="phoneView" hidden>
  <div class="pv-bar"><span>Phone view · 390 × 844</span>
    <button class="pv-close" id="pvClose">Back to full view <kbd>Esc</kbd></button></div>
  <div class="pv-frame"><iframe id="pvIframe" title="Phone view of this page"></iframe></div>
</div>

<script src="pnl-data.js"></script>
<script>
'use strict';
const D = window.PNL_DATA;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

// ---------- formatting ----------
const nf0 = new Intl.NumberFormat('en-IN', { maximumFractionDigits: 0 });
const nf2 = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const MINUS = '−';
const rs = n => '₹' + nf0.format(Math.round(Math.abs(n)));
const rsP = n => '₹' + nf2.format(n);
const rnd = n => Math.sign(n) * Math.round(Math.abs(n));
const signed = n => (rnd(n) > 0 ? '+' : rnd(n) < 0 ? MINUS : '') + rs(n);
const cls = n => rnd(n) > 0 ? 'gain' : rnd(n) < 0 ? 'loss' : 'flat';
function compact(n) {
  const a = Math.abs(n), s = n > 0 ? '+' : n < 0 ? MINUS : '';
  if (a >= 1e7) return s + (a / 1e7).toFixed(a >= 1e8 ? 0 : 2) + 'Cr';
  if (a >= 1e5) return s + (a / 1e5).toFixed(a >= 1e6 ? 1 : 2) + 'L';
  if (a >= 1e3) return s + (a / 1e3).toFixed(a >= 1e4 ? 0 : 1) + 'k';
  return s + Math.round(a);
}
const pct = (gain, cost) => cost ? (gain >= 0 ? '+' : MINUS) + Math.abs(gain / cost * 100).toFixed(1) + '%' : '';
const dt = s => new Date(s + 'T00:00:00');
const fmtDay = s => dt(s).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtShort = s => dt(s).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: '2-digit' });
const fmtMonth = m => dt(m + '-01').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
const monAbbr = m => dt(m + '-01').toLocaleDateString('en-IN', { month: 'short' });
const isoOf = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const fyOf = date => { const y = +date.slice(0, 4), m = +date.slice(5, 7); const s = m >= 4 ? y : y - 1; return s; };
const fyLabel = s => `FY ${s}-${String(s + 1).slice(2)}`;
const daysBetween = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
function ltDate(buy) { const d = dt(buy); d.setFullYear(d.getFullYear() + 1); d.setDate(d.getDate() + 1); return isoOf(d); }

// ---------- data indexes ----------
const ACC = Object.fromEntries(D.accounts.map(a => [a.id, a]));
const PERSON = Object.fromEntries(D.people.map(p => [p.id, p]));
const byDate = {};
for (const r of D.records) (byDate[r.date] = byDate[r.date] || []).push(r);
const allDates = Object.keys(byDate).sort();
for (const r of D.records) for (const s of r.sells) s.cost = s.lots.reduce((c, l) => c + l.q * l.p, 0);

// ---------- state ----------
const store = { get(k, d) { try { const v = localStorage.getItem('pnl.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem('pnl.' + k, JSON.stringify(v)); } catch {} } };
// Top filter: each view is a set of accounts with this person's share of each (1 = whole account, 0.5 = half).
const VIEWS = D.views || D.people.map(p => ({ id: p.id, name: p.name,
  shares: Object.fromEntries(D.accounts.filter(a => a.person === p.id).map(a => [a.id, 1])) }));
const VIEW = Object.fromEntries(VIEWS.map(v => [v.id, v]));
const S = {
  tab: ['day', 'cal', 'tax', 'hold'].includes(location.hash.slice(1)) ? location.hash.slice(1) : store.get('tab', 'day'),
  view: store.get('view', null), account: store.get('account', 'ALL'),
  date: D.asOf, month: D.asOf.slice(0, 7), fy: fyOf(D.asOf), holdSort: store.get('holdSort', 'pnl'),
};
if (!VIEW[S.view]) S.view = VIEWS[0].id;
if (S.account !== 'ALL' && !(S.account in VIEW[S.view].shares)) S.account = 'ALL';

const shareOf = acc => VIEW[S.view].shares[acc] || 0;
function selAccounts() {
  if (S.account !== 'ALL') return [S.account];
  return D.accounts.map(a => a.id).filter(id => shareOf(id) > 0);
}
// Records and holdings scaled by the view's share of each account. Quantities are scaled, so every amount derived
// from them (values, gains) is the share too; `oq` keeps the real traded quantity for display.
const scaleLots = (lots, k) => lots.map(l => ({ ...l, q: l.q * k, oq: l.q }));
function scaleRec(r, k) {
  if (k === 1) return r;
  return { ...r, gross: r.gross * k, charges: r.charges * k, net: r.net * k,
    buys: r.buys.map(b => ({ ...b, q: b.q * k, oq: b.q })),
    sells: r.sells.map(s => ({ ...s, q: s.q * k, oq: s.q, gross: s.gross * k, cost: s.cost * k, lots: scaleLots(s.lots, k) })) };
}
let cacheKey = '', cache;
function V() {
  const key = S.view + '|' + S.account;
  if (key !== cacheKey) {
    const set = new Set(selAccounts());
    const records = D.records.filter(r => set.has(r.account)).map(r => scaleRec(r, shareOf(r.account)));
    const byD = {};
    for (const r of records) (byD[r.date] = byD[r.date] || []).push(r);
    const holdings = D.holdings.filter(h => set.has(h.account))
      .map(h => { const k = shareOf(h.account); return k === 1 ? h : { ...h, lots: scaleLots(h.lots, k) }; });
    cache = { set, records, byD, dates: Object.keys(byD).sort(), holdings }; cacheKey = key;
  }
  return cache;
}
const recsOn = date => V().byD[date] || [];
const selDates = () => V().dates;
const warnsOn = date => D.warnings.filter(w => w.date === date && V().set.has(w.account));
const qty = x => x.oq ?? x.q;
const pctTxt = k => Math.round(k * 100) + '%';
const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);

// ---------- icons ----------
const ICON = {
  prev: '<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  next: '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  warn: '<svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5v.5"/></svg>',
};
const alertHtml = w => `<div class="alert ${w.level === 'error' ? 'error' : 'warn'}" role="${w.level === 'error' ? 'alert' : 'status'}">${ICON.warn}
  <div><b>${esc(ACC[w.account]?.label || w.account)}:</b> ${esc(w.text)}</div></div>`;
const termPills = lots => ['IN', 'ST', 'LT', 'NA'].filter(t => lots.some(l => l.t === t))
  .map(t => `<span class="pill ${t}" title="${{ IN: 'Intraday', ST: 'Short-term', LT: 'Long-term', NA: 'Buy record missing' }[t]}">${{ IN: 'INTRADAY', ST: 'ST', LT: 'LT', NA: 'COST ?' }[t]}</span>`).join('');

// ---------- header: filters ----------
function renderFilters() {
  const v = VIEW[S.view];
  $('#people').innerHTML = VIEWS.map(x => `<button class="chip" data-view="${x.id}" aria-pressed="${S.view === x.id}">${esc(x.name)}</button>`).join('');
  const ids = D.accounts.map(a => a.id).filter(id => v.shares[id] > 0);
  const oneHolder = new Set(ids.map(id => ACC[id].person)).size === 1;
  $('#accts').hidden = ids.length < 2;
  $('#accts').innerHTML = [`<button class="chip sub" data-account="ALL" aria-pressed="${S.account === 'ALL'}">All accounts</button>`,
    ...ids.map(id => `<button class="chip sub" data-account="${id}" aria-pressed="${S.account === id}">${esc(oneHolder ? ACC[id].broker : ACC[id].label)}</button>`)].join('');
  // "Anup's share: 50% of PEW" / "DD's share: 100% of JPW + 50% of PEW"
  const byHolder = {};
  for (const id of ids) byHolder[ACC[id].person] = v.shares[id];
  const partial = Object.values(byHolder).some(k => k < 1);
  $('#shareNote').hidden = !partial;
  if (partial) $('#shareNote').innerHTML = `${esc(v.name)}'s share: ` + Object.entries(byHolder).sort((a, b) => b[1] - a[1])
    .map(([p, k]) => `<b>${pctTxt(k)} of ${esc(PERSON[p].name)}</b>`).join(' + ') + '. All amounts below are this share.';
}
$('#people').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  S.view = b.dataset.view; S.account = 'ALL';
  store.set('view', S.view); store.set('account', S.account); render();
});
$('#accts').addEventListener('click', e => {
  const b = e.target.closest('[data-account]'); if (!b) return;
  S.account = b.dataset.account; store.set('account', S.account); render();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return;
  go(b.dataset.tab);
});
function go(tab) {
  S.tab = tab; store.set('tab', tab);
  history.replaceState(null, '', '#' + tab);
  render(); window.scrollTo({ top: 0 });
}

// ---------- Day ----------
function renderDay() {
  const dates = selDates();
  const recs = recsOn(S.date);
  const warns = warnsOn(S.date);
  const prev = [...dates].reverse().find(d => d < S.date), next = dates.find(d => d > S.date);
  const net = sum(recs, r => r.net), gross = sum(recs, r => r.gross), ch = sum(recs, r => r.charges);
  const sold = sum(recs, r => sum(r.sells, s => s.q * s.p)), bought = sum(recs, r => sum(r.buys, b => b.q * b.p));
  const nS = sum(recs, r => r.sells.length), nB = sum(recs, r => r.buys.length);

  let h = `<div class="pager">
    <button class="icon-btn" id="dPrev" ${prev ? '' : 'disabled'} aria-label="Previous trading day with trades">${ICON.prev}</button>
    <label class="pager-label"><span>${fmtDay(S.date)}</span><input type="date" id="dPick" value="${S.date}" min="${allDates[0]}" max="${D.asOf}" aria-label="Pick a date"></label>
    <button class="icon-btn" id="dNext" ${next ? '' : 'disabled'} aria-label="Next trading day with trades">${ICON.next}</button>
  </div>`;
  if (S.date !== D.asOf) h += `<div style="margin:-6px 0 6px;text-align:right"><button class="link-btn" id="dLatest">Jump to latest (${fmtShort(D.asOf)}) →</button></div>`;

  h += `<div class="card hero-wrap"><div class="hero">
      <div class="label">Net realised P&amp;L${S.date === D.asOf ? ' today' : ''}</div>
      <div class="big num ${cls(net)}">${recs.length ? signed(net) : '—'}</div>
      <div class="sub">${recs.length ? `${nS} sold · ${nB} bought · ${recs.length} account${recs.length > 1 ? 's' : ''} traded` : 'No trades on this day'}</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Gross gain</div><div class="v num ${cls(gross)}">${signed(gross)}</div></div>
      <div class="stat"><div class="k">Charges (est.)</div><div class="v num">${rs(ch)}</div></div>
      <div class="stat"><div class="k">Sold value</div><div class="v num">${rs(sold)}</div></div>
      <div class="stat"><div class="k">Bought value</div><div class="v num">${rs(bought)}</div></div>
    </div></div>`;
  h += warns.map(alertHtml).join('');

  if (recs.length) {
    h += `<h2>By account</h2><div class="grid">`;
    const order = D.accounts.map(a => a.id);
    for (const r of [...recs].sort((a, b) => order.indexOf(a.account) - order.indexOf(b.account))) h += acctCard(r);
    h += `</div>`;
  } else {
    h += `<div class="card empty" style="margin-top:12px"><b>No trades</b>${prev ? 'Use ‹ to go to the previous day with trades.' : ''}</div>`;
  }
  $('#v-day').innerHTML = h;
  $('#dPrev').onclick = () => { S.date = prev; render(); };
  $('#dNext').onclick = () => { S.date = next; render(); };
  $('#dPick').onchange = e => { if (e.target.value) { S.date = e.target.value; render(); } };
  const latest = $('#dLatest'); if (latest) latest.onclick = () => { S.date = D.asOf; render(); };
}
function acctCard(r) {
  const a = ACC[r.account];
  let h = `<div class="card"><div class="acct-head"><div><div class="name">${esc(PERSON[a.person].name)}</div><div class="broker">${esc(a.broker)}${shareOf(r.account) < 1 ? `<span class="share">${pctTxt(shareOf(r.account))} share</span>` : ''}</div></div>
    <div class="net num ${cls(r.net)}">${signed(r.net)}</div></div>`;
  if (r.sells.length) {
    h += `<div class="sec-label">Sold</div>`;
    for (const s of r.sells) {
      h += `<details class="sell"><summary><div class="row">${ICON.chev}
        <div class="l"><div class="sym">${esc(s.s)} ${termPills(s.lots)}</div><div class="meta num">${qty(s)} @ ${rsP(s.p)}</div></div>
        <div class="r"><div class="v num ${cls(s.gross)}">${signed(s.gross)}</div><div class="p num">${pct(s.gross, s.cost)}</div></div></div></summary>
        <div class="lots">${s.lots.map(l => {
          if (l.p == null) return `<div class="lot"><div class="l num">${qty(l)} with no buy record</div><span class="pill NA">COST ?</span><div class="r muted">—</div></div>`;
          const g = (s.p - l.p) * l.q;
          return `<div class="lot"><div class="l num">${qty(l)} bought ${l.t === 'IN' ? 'same day' : fmtShort(l.d)} @ ${rsP(l.p)}</div>
            <span class="pill ${l.t}">${l.t === 'IN' ? 'INTRADAY' : l.t}</span><div class="r num ${cls(g)}">${signed(g)}</div></div>`;
        }).join('')}</div></details>`;
    }
  }
  if (r.buys.length) {
    h += `<div class="sec-label">Bought</div>`;
    h += r.buys.map(b => `<div class="row"><div class="l"><div class="sym">${esc(b.s)}</div><div class="meta num">${qty(b)} @ ${rsP(b.p)}</div></div>
      <div class="r"><div class="v num">${rs(b.q * b.p)}</div></div></div>`).join('');
  }
  h += `<div class="acct-foot"><span>Gross <b class="num ${cls(r.gross)}">${signed(r.gross)}</b></span><span>Charges <b class="num">${rs(r.charges)}</b></span></div></div>`;
  return h;
}

// ---------- Calendar ----------
function dayNets() {
  const m = {};
  for (const r of V().records) m[r.date] = (m[r.date] || 0) + r.net;
  return m;
}
function renderCal() {
  const nets = dayNets();
  const [y, mo] = S.month.split('-').map(Number);
  const months = [...new Set(allDates.map(d => d.slice(0, 7)))];
  const mi = months.indexOf(S.month);
  const inMonth = Object.entries(nets).filter(([d]) => d.startsWith(S.month));
  const mNet = sum(inMonth, e => e[1]);
  const up = inMonth.filter(e => Math.round(e[1]) > 0).length, down = inMonth.filter(e => Math.round(e[1]) < 0).length;
  const best = inMonth.reduce((b, e) => !b || e[1] > b[1] ? e : b, null), worst = inMonth.reduce((b, e) => !b || e[1] < b[1] ? e : b, null);
  // colour scale: sqrt of |net| against the 95th percentile of all days, so one huge day doesn't wash out the rest
  const mags = Object.values(nets).map(Math.abs).sort((a, b) => a - b);
  const cap = mags[Math.floor(mags.length * 0.95)] || 1;
  const tint = n => { const k = Math.min(1, Math.sqrt(Math.abs(n) / cap)); const p = Math.round(14 + k * 62);
    return `background:color-mix(in srgb,var(${n > 0 ? '--gain-fill' : '--loss-fill'}) ${p}%,var(--surface))`; };
  const ink = n => Math.min(1, Math.sqrt(Math.abs(n) / cap)) > 0.62 ? 'color:#fff' : '';

  let h = `<div class="pager">
    <button class="icon-btn" id="mPrev" ${mi > 0 ? '' : 'disabled'} aria-label="Previous month">${ICON.prev}</button>
    <div class="pager-label">${fmtMonth(S.month)}</div>
    <button class="icon-btn" id="mNext" ${mi >= 0 && mi < months.length - 1 ? '' : 'disabled'} aria-label="Next month">${ICON.next}</button></div>
  <div class="cal-layout"><div>
  <div class="month-sum">
    <div class="stat"><div class="k">Net P&amp;L this month</div><div class="v num ${cls(mNet)}">${inMonth.length ? signed(mNet) : '—'}</div></div>
    <div class="stat"><div class="k">Up / down days</div><div class="v num">${up} / ${down}</div></div>
    <div class="stat"><div class="k">Best day</div><div class="v num ${best ? cls(best[1]) : ''}">${best ? compact(best[1]) : '—'}</div></div>
    <div class="stat"><div class="k">Worst day</div><div class="v num ${worst ? cls(worst[1]) : ''}">${worst ? compact(worst[1]) : '—'}</div></div>
  </div>
  <div class="card cal"><div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri'].map(d => `<div class="cal-dow">${d}</div>`).join('')}`;
  const first = new Date(y, mo - 1, 1), lastDay = new Date(y, mo, 0).getDate();
  let lead = (first.getDay() + 6) % 7; // Mon=0
  if (lead > 4) lead = 0; // month starts on a weekend: first weekday cell is Monday
  for (let i = 0; i < lead; i++) h += `<div class="cell blank"></div>`;
  for (let d = 1; d <= lastDay; d++) {
    const date = isoOf(new Date(y, mo - 1, d)), wd = new Date(y, mo - 1, d).getDay();
    if (wd === 0 || wd === 6) continue;
    const n = nets[date], has = n !== undefined;
    const fut = date > D.asOf;
    const c = ['cell', has ? '' : 'none', date === S.date ? 'sel' : '', fut ? 'future' : ''].join(' ');
    h += has
      ? `<button class="${c}" data-date="${date}" style="${tint(n)};${ink(n)}" title="${fmtDay(date)}: ${signed(n)}" aria-label="${fmtDay(date)}, ${signed(n)}">
          <span class="d" style="${ink(n)}">${d}</span><span class="n num">${compact(n)}</span></button>`
      : `<div class="${c}"><span class="d">${d}</span><span class="n muted">${fut ? '' : '·'}</span></div>`;
  }
  h += `</div><div class="legend"><span>Loss</span><span class="ramp">${[1, .5, .15].map(k => `<i style="background:color-mix(in srgb,var(--loss-fill) ${Math.round(14 + k * 62)}%,var(--surface))"></i>`).join('')}<i style="background:var(--surface-2)"></i>${[.15, .5, 1].map(k => `<i style="background:color-mix(in srgb,var(--gain-fill) ${Math.round(14 + k * 62)}%,var(--surface))"></i>`).join('')}</span><span>Profit</span></div>
  <div class="muted" style="text-align:center;font-size:12px;margin-top:4px">Tap a day to see its trades</div></div></div>`;

  // monthly bars for the FY of the shown month
  const fy = fyOf(S.month + '-01');
  const fyMonths = Array.from({ length: 12 }, (_, i) => { const m = new Date(fy, 3 + i, 1); return isoOf(m).slice(0, 7); }).filter(m => m <= D.asOf.slice(0, 7));
  const mNets = fyMonths.map(m => [m, sum(Object.entries(nets).filter(([d]) => d.startsWith(m)), e => e[1])]);
  const mMax = Math.max(1, ...mNets.map(e => Math.abs(e[1])));
  const fyNet = sum(mNets, e => e[1]);
  h += `<div><h2>${fyLabel(fy)} by month · <span class="num ${cls(fyNet)}" style="text-transform:none;letter-spacing:0">${signed(fyNet)}</span></h2>
    <div class="card bars">${mNets.map(([m, n]) => `<button class="bar-row ${m === S.month ? 'sel' : ''}" data-month="${m}" title="${fmtMonth(m)}: ${signed(n)}">
      <span class="m">${monAbbr(m)}</span>
      <span class="bar-track"><span class="mid"></span>${Math.round(n) ? `<span class="b ${n > 0 ? 'pos' : 'neg'}" style="width:${(Math.abs(n) / mMax * 50).toFixed(2)}%"></span>` : ''}</span>
      <span class="v num ${cls(n)}">${compact(n)}</span></button>`).join('')}</div></div></div>`;

  $('#v-cal').innerHTML = h;
  $('#mPrev').onclick = () => { S.month = months[mi - 1]; render(); };
  $('#mNext').onclick = () => { S.month = months[mi + 1]; render(); };
  $('#v-cal').querySelectorAll('[data-date]').forEach(b => b.onclick = () => { S.date = b.dataset.date; go('day'); });
  $('#v-cal').querySelectorAll('[data-month]').forEach(b => b.onclick = () => { S.month = b.dataset.month; render(); });
}

// ---------- Tax ----------
// Equity capital gains: sales before 23 Jul 2024 → STCG 15%, LTCG 10%; from 23 Jul 2024 → STCG 20%, LTCG 12.5%.
// LTCG exemption is per person per FY: ₹1.25 lakh from FY 2024-25. Short-term losses offset both; long-term losses only LTCG.
const NEW_RATES_FROM = '2024-07-23';
function taxFor(personId, fy) {
  const accs = new Set(selAccounts().filter(a => ACC[a].person === personId));
  const t = { stOld: 0, stNew: 0, ltOld: 0, ltNew: 0, intra: 0, charges: 0, byAcc: {} };
  for (const r of D.records) {
    if (!accs.has(r.account) || fyOf(r.date) !== fy) continue;
    t.charges += r.charges;
    const b = t.byAcc[r.account] = t.byAcc[r.account] || { st: 0, lt: 0, intra: 0 };
    const nw = r.date >= NEW_RATES_FROM;
    for (const s of r.sells) for (const l of s.lots) {
      if (l.p == null) continue; // cost unknown: not counted until the buy is imported
      const g = (s.p - l.p) * l.q;
      if (l.t === 'IN') { t.intra += g; b.intra += g; }
      else if (l.t === 'ST') { nw ? t.stNew += g : t.stOld += g; b.st += g; }
      else { nw ? t.ltNew += g : t.ltOld += g; b.lt += g; }
    }
  }
  t.st = t.stOld + t.stNew; t.lt = t.ltOld + t.ltNew;
  // set-off: a net short-term loss reduces long-term gains
  let st = t.st, lt = t.lt;
  if (st < 0) { lt += st; st = 0; }
  t.exemption = fy >= 2024 ? 125000 : 100000;
  const ltTaxable = Math.max(0, lt - t.exemption);
  const stRate = t.st > 0 ? (t.stOld * 0.15 + t.stNew * 0.20) / t.st : 0.20;
  const ltRate = t.lt > 0 && t.ltOld > 0 ? (t.ltOld * 0.10 + t.ltNew * 0.125) / t.lt : 0.125;
  t.tax = Math.max(0, st) * stRate + ltTaxable * ltRate;
  t.ltNetted = lt; t.exemptUsed = Math.min(t.exemption, Math.max(0, lt));
  t.share = Math.max(0, ...[...accs].map(shareOf));
  if (t.share !== 1) {
    for (const f of ['stOld', 'stNew', 'ltOld', 'ltNew', 'intra', 'charges', 'st', 'lt', 'tax']) t[f] *= t.share;
    for (const b of Object.values(t.byAcc)) { b.st *= t.share; b.lt *= t.share; b.intra *= t.share; }
  }
  return t;
}
function renderTax() {
  const fys = [...new Set(D.records.map(r => fyOf(r.date)))].sort();
  if (!fys.includes(S.fy)) S.fy = fys[fys.length - 1];
  const persons = D.people.filter(p => selAccounts().some(a => ACC[a].person === p.id));
  let h = `<div class="chips" style="padding:0 0 12px;margin:0">${fys.map(f => `<button class="chip sub" data-fy="${f}" aria-pressed="${f === S.fy}">${fyLabel(f)}</button>`).join('')}</div>`;
  const all = persons.map(p => [p, taxFor(p.id, S.fy)]);
  const totGain = sum(all, e => e[1].st + e[1].lt + e[1].intra), totTax = sum(all, e => e[1].tax);
  h += `<div class="card"><div class="hero"><div class="label">Realised gains · ${fyLabel(S.fy)}${S.fy === fyOf(D.asOf) ? ' so far' : ''}</div>
    <div class="big num ${cls(totGain)}">${signed(totGain)}</div>
    <div class="sub">Estimated capital-gains tax <b class="num" style="color:var(--text)">${rs(totTax)}</b>${persons.length > 1 ? ' across ' + persons.length + ' account holders' : ''}</div></div></div>`;
  h += `<h2>By account holder (tax is on their PAN)</h2><div class="grid three">`;
  for (const [p, t] of all) {
    const pctUsed = t.exemption ? Math.min(100, t.exemptUsed / t.exemption * 100) : 0;
    h += `<div class="card tax-card"><div class="tax-head"><div class="name">${esc(p.name)}${t.share < 1 ? `<span class="share">${pctTxt(t.share)} share</span>` : ''}</div>
        <div class="est"><div class="k">Est. tax</div><div class="v num">${rs(t.tax)}</div></div></div>
      <div class="kv"><span class="k"><span class="pill ST">ST</span> Short-term gains</span><span class="v num ${cls(t.st)}">${signed(t.st)}</span></div>
      <div class="kv"><span class="k"><span class="pill LT">LT</span> Long-term gains</span><span class="v num ${cls(t.lt)}">${signed(t.lt)}</span></div>
      <div class="kv"><span class="k"><span class="pill IN">INTRADAY</span> Speculative</span><span class="v num ${cls(t.intra)}">${signed(t.intra)}</span></div>
      <div class="kv"><span class="k">Charges paid (est.)</span><span class="v num">${rs(t.charges)}</span></div>
      <div class="meter" style="margin-top:12px"><div class="track"><div class="fill" style="width:${pctUsed.toFixed(1)}%"></div></div>
        <div class="cap"><span>${t.share < 1 ? esc(p.name) + "'s " : ''}LTCG exemption used</span><span class="num">${rs(t.exemptUsed)} of ${rs(t.exemption)}</span></div></div>
      ${Object.keys(t.byAcc).length > 1 ? Object.entries(t.byAcc).map(([a, b]) => `<div class="kv"><span class="k">${esc(ACC[a].broker)}</span><span class="v num ${cls(b.st + b.lt + b.intra)}">${signed(b.st + b.lt + b.intra)}</span></div>`).join('') : ''}
    </div>`;
  }
  h += `</div><p class="note">Estimates only, not tax advice. Rates: STCG 20% and LTCG 12.5% above ₹1.25 lakh per person (15% / 10% for sales before 23 Jul 2024).
    A net short-term loss is set off against long-term gains. Intraday gains are speculative income, taxed at your slab rate, so they're not in the estimate.
    Gains are before charges; brokerage and exchange charges can be deducted, STT can't.
    ${all.some(e => e[1].share < 1) ? ' For a partner\'s share, tax is worked out on the account holder\'s full gains and then split by share; the exemption bar shows the holder\'s full usage.' : ''}</p>`;
  $('#v-tax').innerHTML = h;
  $('#v-tax').querySelectorAll('[data-fy]').forEach(b => b.onclick = () => { S.fy = +b.dataset.fy; render(); });
}

// ---------- Holdings ----------
function renderHold() {
  const set = V().set;
  const hs = V().holdings.map(x => {
    const q = sum(x.lots, l => l.q), cost = sum(x.lots, l => l.q * l.p), value = q * x.ltp;
    return { ...x, qty: q, oqty: sum(x.lots, l => qty(l)), cost, value, pnl: value - cost };
  });
  const cost = sum(hs, x => x.cost), value = sum(hs, x => x.value), pnl = value - cost;
  const soon = [];
  for (const x of hs) for (const l of x.lots) {
    const ld = ltDate(l.d), left = daysBetween(D.asOf, ld);
    if (left > 0 && left <= 60) soon.push({ x, l, left, g: (x.ltp - l.p) * l.q });
  }
  soon.sort((a, b) => a.left - b.left);
  const sorters = { pnl: (a, b) => b.pnl - a.pnl, value: (a, b) => b.value - a.value, name: (a, b) => a.s.localeCompare(b.s) };
  hs.sort(sorters[S.holdSort] || sorters.pnl);

  let h = `<div class="card"><div class="hero"><div class="label">Unrealised P&amp;L on open lots</div>
      <div class="big num ${cls(pnl)}">${signed(pnl)}</div><div class="sub num">${pct(pnl, cost)} on ${rs(cost)} invested · prices as of ${fmtShort(D.asOf)}</div></div>
    <div class="stats"><div class="stat"><div class="k">Invested</div><div class="v num">${rs(cost)}</div></div>
      <div class="stat"><div class="k">Current value</div><div class="v num">${rs(value)}</div></div>
      <div class="stat"><div class="k">Positions</div><div class="v num">${hs.length}</div></div>
      <div class="stat"><div class="k">Open lots</div><div class="v num">${sum(hs, x => x.lots.length)}</div></div></div></div>`;
  if (soon.length) {
    h += `<h2>Turning long-term in the next 60 days</h2><div class="card soon">${soon.map(({ x, l, left, g }) => `<div class="row">
      <div class="l"><div class="sym">${esc(x.s)} <span class="muted" style="font-weight:400;font-size:12px">${esc(ACC[x.account].label)}</span></div>
      <div class="meta num">${qty(l)} bought ${fmtShort(l.d)} @ ${rsP(l.p)}</div></div>
      <div class="r"><div class="days-left">LT in ${left} day${left > 1 ? 's' : ''}</div><div class="p num ${cls(g)}">${signed(g)} now</div></div></div>`).join('')}</div>
      <p class="note" style="margin-top:8px">Selling these after the date moves the gain from 20% short-term to 12.5% long-term tax.</p>`;
  }
  h += `<div class="h2-row"><h2>Positions</h2><div class="seg" role="group" aria-label="Sort">${[['pnl', 'P&L'], ['value', 'Value'], ['name', 'A–Z']].map(([k, t]) =>
    `<button data-sort="${k}" aria-pressed="${S.holdSort === k}">${t}</button>`).join('')}</div></div>`;
  h += hs.length ? `<div class="card">${hs.map(x => `<details class="sell"><summary><div class="row">${ICON.chev}
      <div class="l"><div class="sym">${esc(x.s)} ${x.lots.some(l => daysBetween(D.asOf, ltDate(l.d)) <= 0) ? '<span class="pill LT">LT</span>' : ''}</div>
        <div class="meta num">${x.oqty} · avg ${rsP(x.cost / x.qty)} · LTP ${rsP(x.ltp)}${set.size > 1 ? ' · ' + esc(ACC[x.account].label) : ''}${shareOf(x.account) < 1 ? ' · ' + pctTxt(shareOf(x.account)) + ' share' : ''}</div></div>
      <div class="r"><div class="v num ${cls(x.pnl)}">${signed(x.pnl)}</div><div class="p num">${pct(x.pnl, x.cost)}</div></div></div></summary>
      <div class="lots">${x.lots.map(l => { const left = daysBetween(D.asOf, ltDate(l.d)), g = (x.ltp - l.p) * l.q;
        return `<div class="lot"><div class="l num">${qty(l)} bought ${fmtShort(l.d)} @ ${rsP(l.p)}</div>
          ${left <= 0 ? '<span class="pill LT">LT</span>' : `<span class="pill ST" title="Long-term on ${fmtShort(ltDate(l.d))}">LT in ${left}d</span>`}
          <div class="r num ${cls(g)}">${signed(g)}</div></div>`; }).join('')}</div></details>`).join('')}</div>`
    : `<div class="card empty"><b>No open positions</b></div>`;
  $('#v-hold').innerHTML = h;
  $('#v-hold').querySelectorAll('[data-sort]').forEach(b => b.onclick = () => { S.holdSort = b.dataset.sort; store.set('holdSort', S.holdSort); render(); });
}

// ---------- render ----------
function render() {
  renderFilters();
  document.querySelectorAll('#tabs [data-tab]').forEach(b => {
    if (b.dataset.tab === S.tab) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
  });
  for (const t of ['day', 'cal', 'tax', 'hold']) $('#v-' + t).hidden = t !== S.tab;
  ({ day: renderDay, cal: renderCal, tax: renderTax, hold: renderHold })[S.tab]();
}
$('#asof').innerHTML = `Data to<br><b class="t2">${fmtShort(D.asOf)}</b>`;
$('#sampleBadge').hidden = !D.sample;
render();

// ---------- phone view: the page itself in a 390px-wide iframe, so the real mobile layout applies ----------
const embedded = window.self !== window.top;
if (embedded) document.documentElement.classList.add('embedded');
function phoneView(on) {
  $('#phoneView').hidden = !on;
  document.body.style.overflow = on ? 'hidden' : '';
  store.set('phone', on);
  if (on) { $('#pvIframe').src = location.pathname + '#' + S.tab; return; }
  $('#pvIframe').src = 'about:blank';
  // pick up the filter and tab chosen inside the phone view
  const v = store.get('view', S.view), a = store.get('account', 'ALL'), t = store.get('tab', S.tab);
  if (VIEW[v]) S.view = v;
  S.account = a === 'ALL' || a in VIEW[S.view].shares ? a : 'ALL';
  if (['day', 'cal', 'tax', 'hold'].includes(t)) { S.tab = t; history.replaceState(null, '', '#' + t); }
  render();
}
$('#phoneBtn').onclick = () => phoneView(true);
$('#pvClose').onclick = () => phoneView(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#phoneView').hidden) phoneView(false); });
if (!embedded && store.get('phone', false) && matchMedia('(min-width:760px)').matches && location.hash !== '#selftest') phoneView(true);

// ---------- self test: open with #selftest ----------
if (location.hash === '#selftest') {
  const out = [], ok = (c, m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
  ok(D && D.records.length > 0, 'data loaded: ' + D.records.length + ' day-records');
  let lotQty = true, gross = true, net = true;
  for (const r of D.records) {
    for (const s of r.sells) {
      if (sum(s.lots, l => l.q) !== s.q) lotQty = false;
      if (Math.abs(sum(s.lots, l => l.p == null ? 0 : (s.p - l.p) * l.q) - s.gross) > 0.05) gross = false;
    }
    if (Math.abs(r.gross - r.charges - r.net) > 0.05) net = false;
  }
  ok(lotQty, 'every sell quantity equals the sum of its FIFO lots');
  ok(gross, 'every sell gross equals the sum of its lot gains');
  ok(net, 'every day: gross − charges = net');
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => l.t !== 'LT' || r.date >= ltDate(l.d)))), 'long-term lots were held more than 12 months');
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => l.t !== 'ST' || r.date < ltDate(l.d)))), 'short-term lots were held 12 months or less');
  ok(D.records.every(r => r.sells.every(s => s.lots.every(l => (l.t === 'NA') === (l.p == null)))), 'unknown-cost lots are marked NA');
  for (const t of ['day', 'cal', 'tax', 'hold']) {
    try { S.tab = t; render(); ok($('#v-' + t).innerHTML.length > 200, 'view renders: ' + t); } catch (e) { ok(false, 'view ' + t + ': ' + e.message); }
  }
  S.view = 'PEW'; S.account = 'PEW-ANGEL'; S.tab = 'day'; render();
  ok(recsOn(D.asOf).every(r => r.account === 'PEW-ANGEL'), 'account filter limits records');
  const netOf = v => { S.view = v; S.account = 'ALL'; return sum(V().records, r => r.net); };
  const pew = netOf('PEW'), jpw = netOf('JPW');
  ok(Math.abs(netOf('ANUP') - pew / 2) < 1, 'Anup = 50% of PEW');
  ok(Math.abs(netOf('DD') - (jpw + pew / 2)) < 1, 'DD = 100% of JPW + 50% of PEW');
  ok(Math.abs(netOf('ANUP') + netOf('DD') - (pew + jpw)) < 1, 'Anup + DD = PEW + JPW');
  try { for (const v of ['ANUP', 'DD']) for (const t of ['day', 'cal', 'tax', 'hold']) { S.view = v; S.account = 'ALL'; S.tab = t; render(); } ok(true, 'Anup and DD views render'); }
  catch (e) { ok(false, 'share views: ' + e.message); }
  ok(Math.abs(sum(D.accounts.map(a => a.id), id => sum(D.records.filter(r => r.account === id), r => r.net)) - sum(D.records, r => r.net)) < 1, 'per-account totals add up to the family total');
  ok(compact(125000) === '+1.25L' && compact(-4500) === MINUS + '4.5k' && compact(12500000) === '+1.25Cr', 'compact INR format');
  ok(document.documentElement.scrollWidth <= window.innerWidth + 1, 'no horizontal page scroll at ' + window.innerWidth + 'px');
  phoneView(true); ok(!$('#phoneView').hidden && $('#pvIframe').getAttribute('src').endsWith('#' + S.tab), 'phone view opens the page in a frame');
  phoneView(false); ok($('#phoneView').hidden, 'phone view closes'); store.set('phone', false);
  S.view = VIEWS[0].id; S.account = 'ALL';
  for (const v of ['day', 'cal', 'tax', 'hold']) $('#v-' + v).hidden = true;
  const st = $('#selftest'); st.hidden = false; st.textContent = out.join('\n');
}
</script>
